      '<div class="day-b">' + (list.length ? list.map(rowHTML).join('') :
        '<button class="empty" data-act="add" data-date="' + d + '">' + (past ? 'Sin contenido' : 'Sin contenido · + Agregar') + '</button>') + '</div>' +
      '<button class="day-add" data-act="add" data-date="' + d + '" title="Agregar contenido este día">' + IC.plus + '</button></section>';
  });
  if (open) html += '</div>';
  if (!days.length && !backlog.length){
    html = '<div class="lv-empty"><b>No hay contenidos en este período</b>Probá con otro rango o revisá los filtros de estado.</div>';
  }
  if (!S.items.length && MODE !== 'local'){
    html = '<div class="lv-empty"><b>La planilla está vacía</b>¿Cargamos los ' + SEED.length + ' contenidos programados (25/9 al 25/11)?<br><br><button class="btn primary" data-act="seed">Cargar contenidos programados</button></div>';
  }
  const y = window.scrollY;
  main.innerHTML = html;
  if (S.scrollToToday && S.period.mode === 'todo'){
    const el = $('.day.today', main) || $$('.day[data-date]', main).find(x => x.dataset.date >= today);
    if (el) el.scrollIntoView({ block: 'center' });
  } else window.scrollTo(0, y);
  S.scrollToToday = false;
  if (flashId){ const r = main.querySelector('.row[data-id="' + CSS.escape(flashId) + '"]'); if (r) r.classList.add('flash'); flashId = null; }
}

/* =====================================================================
   Vista 2: Gantt
   ===================================================================== */
const LABEL_W = () => (innerWidth < 640 ? 150 : 280);
function groupKey(it){
  if (S.group === 'estado') return it.estado || 'Idea';
  if (S.group === 'formato') return it.formato || '(sin formato)';
  if (S.group === 'red') return it.red || '(sin red)';
  if (S.group === 'responsable') return it.responsable || '(sin responsable)';
  return '';
}
function ganttGroups(items){
  if (S.group === 'none') return [['', items]];
  const m = new Map();
  items.forEach(i => { const k = groupKey(i); if (!m.has(k)) m.set(k, []); m.get(k).push(i); });
  const keys = [...m.keys()];
  if (S.group === 'estado'){ const order = allEstados(); keys.sort((a, b) => order.indexOf(a) - order.indexOf(b)); }
  else keys.sort((a, b) => (a.startsWith('(') ? 1 : 0) - (b.startsWith('(') ? 1 : 0) || a.localeCompare(b));
  return keys.map(k => [k, m.get(k)]);
}
function geom(fecha, inicio, f, dw, days){
  const g = { ms: (D.diff(f, fecha) + 0.5) * dw, bar: null };
  if (D.valid(inicio) && inicio < fecha){
    const s = D.diff(f, inicio), e = D.diff(f, fecha);
    const cs = Math.max(s, 0), ce = Math.min(e, days - 1);
    g.bar = { left: cs * dw + 2, width: Math.max((ce - cs + 1) * dw - 4, 4), clipL: s < 0 };
  }
  return g;
}
function renderGantt(){
  const main = $('#main');
  const [f, t] = range(), today = D.today();
  const days = D.diff(f, t) + 1;
  const LW = LABEL_W();
  const vis = S.items.filter(i => passesFilters(i));
  const items = vis.filter(i => inRange(i, f, t)).sort(byDate);
  const noDate = vis.filter(i => !D.valid(i.fecha)).length;

  const prev = $('.g-scroll', main);
  const keep = prev && !S.scrollToToday ? { l: prev.scrollLeft, t: prev.scrollTop, days: S.gdays, f: S.gf, dw: S.gdw } : null;
  const padX = parseFloat(getComputedStyle(main).paddingLeft) * 2 || 0;
  const avail = Math.max((main.clientWidth || innerWidth) - padX - LW - 18, 200);
  const dw = S.gz ? S.gz : Math.max(18, Math.min(120, Math.floor(avail / days)));
  const W = days * dw;

  // conteo por día (para detectar huecos)
  const cnt = {}; vis.forEach(i => { if (D.valid(i.fecha) && !DEAD.includes(i.estado)) cnt[i.fecha] = (cnt[i.fecha] || 0) + 1; });

  let months = '', dayCells = '', grid = '';
  for (let i = 0, d = f; i < days; i++, d = D.add(d, 1)){
    const wd = D.dow(d), we = wd === 0 || wd === 6, n = cnt[d] || 0, gap = !n && d >= today;
    if (i === 0 || D.d(d) === 1){
      const end = Math.min(D.diff(f, D.mEnd(d)) + 1, days);
      const label = (end - i) * dw > 90 ? MONL[D.m(d)] + ' ' + D.y(d) : (end - i) * dw > 34 ? MON[D.m(d)] : '';
      months += '<div class="g-month" style="left:' + i*dw + 'px;width:' + (end - i)*dw + 'px">' + label + '</div>';
      if (i) grid += '<div class="g-ml" style="left:' + i*dw + 'px"></div>';
    }
    const showN = dw >= 15 || wd === 1;
    dayCells += '<div class="g-day' + (we ? ' we' : '') + (d === today ? ' today' : '') + (gap ? ' gap' : '') + '" data-day="' + d + '" style="left:' + i*dw + 'px;width:' + dw + 'px" title="' + D.short(d) + ' · ' + n + ' contenido' + (n === 1 ? '' : 's') + ' — clic para ver el día">' +
      (dw >= 24 ? '<span class="wd">' + DOW[wd].slice(0, 2) + '</span>' : '') +
      (showN ? '<span class="n">' + D.d(d) + '</span>' : '<span class="n">&nbsp;</span>') +
      (dw >= 14 ? '<span class="cnt">' + '<i></i>'.repeat(Math.min(n, Math.max(1, Math.floor(dw / 6)))) + '</span>' : '') + '</div>';
    if (we) grid += '<div class="g-we" style="left:' + i*dw + 'px;width:' + dw + 'px"></div>';
    else if (gap) grid += '<div class="g-gapcol" style="left:' + i*dw + 'px;width:' + dw + 'px"></div>';
    if (dw >= 14 && i) grid += '<div class="g-vl" style="left:' + i*dw + 'px"></div>';
  }
  if (today >= f && today <= t) grid += '<div class="g-today" style="left:' + ((D.diff(f, today) + 0.5) * dw - 1) + 'px"></div>';

  // filas (con grupos opcionales)
  let rows = '';
  const groups = ganttGroups(items);
  groups.forEach(([k, list]) => {
    if (k) rows += '<div class="g-row g-grp"><div class="g-label" style="width:' + LW + 'px">' +
      (S.group === 'estado' ? '<span class="dot" style="background:' + esc(colorOf(k)) + '"></span>' : '') + esc(k) + ' · ' + list.length + '</div><div class="g-track" style="width:' + W + 'px"></div></div>';
    list.forEach(it => {
      const est = it.estado || 'Idea', c = esc(colorOf(est)), dead = DEAD.includes(est);
      const g = geom(it.fecha, it.inicio, f, dw, days);
      const msIn = it.fecha <= t;
      const tip = esc(it.titulo + ' · ' + est + ' · ' + D.short(it.fecha) + (D.valid(it.inicio) && it.inicio < it.fecha ? ' (producción desde ' + D.short(it.inicio) + ')' : ''));
      rows += '<div class="g-row" data-id="' + esc(it.id) + '">' +
        '<div class="g-label' + (dead ? ' dead' : '') + '" style="width:' + LW + 'px" data-open="' + esc(it.id) + '" title="' + tip + '"><span class="dot" style="background:' + c + '"></span><span class="t">' + esc(it.titulo) + '</span><span class="d">' + D.d(it.fecha) + ' ' + MON[D.m(it.fecha)] + '</span></div>' +
        '<div class="g-track" style="width:' + W + 'px">' +
          (g.bar ? '<div class="bar' + (g.bar.clipL ? ' clipL' : '') + '" data-drag="move" data-id="' + esc(it.id) + '" title="' + tip + ' — arrastrá para mover" style="--c:' + c + ';left:' + g.bar.left + 'px;width:' + g.bar.width + 'px">' + (g.bar.clipL ? '' : '<span class="h" data-drag="start" data-id="' + esc(it.id) + '" title="Arrastrá para cambiar el inicio de producción"></span>') + '</div>' : '') +
          (msIn ? '<div class="ms' + (dead ? ' dead' : '') + '" data-drag="' + (g.bar ? 'end' : 'move') + '" data-id="' + esc(it.id) + '" title="' + tip + ' — arrastrá para cambiar la fecha" style="--c:' + c + ';left:' + g.ms + 'px"><i></i></div>' : '') +
        '</div></div>';
    });
  });

  const groupSel = '<label>Agrupar por <select class="fsel" id="gGroup">' +
    [['none','Nada'],['estado','Estado'],['formato','Formato'],['red','Red'],['responsable','Responsable']].map(([v, l]) => '<option value="' + v + '"' + (S.group === v ? ' selected' : '') + '>' + l + '</option>').join('') + '</select></label>';
  const tools = '<div class="g-tools">' + groupSel +
    '<div class="zoom"><button data-zoom="-1" title="Alejar">−</button><button data-zoom="0" title="Ajustar al ancho">Ajustar</button><button data-zoom="1" title="Acercar">+</button></div>' +
    '<button class="btn" data-act="export" title="Exportar el Gantt a una hoja A4 o A3">' + IC.download + ' Exportar PDF</button>' +
    '<span class="g-note">Arrastrá el rombo para cambiar la fecha de publicación · la barra marca el período de producción' + (noDate ? ' · <b>' + noDate + '</b> sin fecha (ver en Contenidos)' : '') + '</span></div>';

  main.innerHTML = tools + '<div class="gantt" id="gantt"><div class="g-scroll"><div class="g-inner" style="width:' + (LW + W) + 'px">' +
    '<div class="g-head"><div class="g-corner" style="width:' + LW + 'px">Contenido</div><div class="g-cal" style="width:' + W + 'px"><div class="g-months">' + months + '</div><div class="g-days">' + dayCells + '</div></div></div>' +
    '<div class="g-body"><div class="g-grid" style="left:' + LW + 'px;width:' + W + 'px">' + grid + '</div>' +
    (rows || '<div class="g-empty" style="width:' + LW + 'px;position:sticky;left:0;width:min(100%,600px)">No hay contenidos en este período con los filtros actuales.</div>') +
    '</div></div></div></div>';
  sizeGantt();
  const sc = $('.g-scroll', main);
  if (keep && keep.f === f && keep.days === days && keep.dw === dw){ sc.scrollLeft = keep.l; sc.scrollTop = keep.t; }
  else if (today >= f && today <= t){
    if (W > avail) sc.scrollLeft = Math.max(0, D.diff(f, today) * dw - avail * 0.25);
    // bajar hasta los contenidos de hoy en adelante
    const r = $$('.g-row[data-id]', sc).find(x => (byId(x.dataset.id) || {}).fecha >= today);
    if (r && r.offsetTop > sc.clientHeight * 0.6) sc.scrollTop = r.offsetTop - 70 - 36 * 3;
  }
  S.gdw = dw; S.gf = f; S.gdays = days;
  S.scrollToToday = false;
}
function sizeGantt(){
  const g = $('#gantt'); if (!g) return;
  const top = g.getBoundingClientRect().top + window.scrollY;
  g.style.height = Math.max(360, innerHeight - top - 20) + 'px';
}

/* ---------- arrastrar en el Gantt */
function gDown(e){
  const el = e.target.closest('[data-drag]');
  if (!el || e.button !== 0) return;
  const it = byId(el.dataset.id); if (!it) return;
  e.preventDefault(); e.stopPropagation();
  el.setPointerCapture(e.pointerId);
  S.drag = { id: it.id, part: el.dataset.drag, x0: e.clientX, y0: e.clientY, moved: false, fecha: it.fecha, inicio: it.inicio, nf: it.fecha, ni: it.inicio, el, row: el.closest('.g-row') };
  document.body.classList.add('dragging-g');
}
function gMove(e){
  const g = S.drag; if (!g) return;
  const dx = e.clientX - g.x0;
  if (!g.moved && Math.abs(dx) < 4) return;
  g.moved = true;
  const dlt = Math.round(dx / S.gdw);
  const hasI = D.valid(g.inicio) && g.inicio < g.fecha;
  if (g.part === 'move'){ g.nf = D.add(g.fecha, dlt); g.ni = hasI ? D.add(g.inicio, dlt) : g.inicio; }
  else if (g.part === 'end'){ g.nf = D.add(g.fecha, dlt); g.ni = hasI && g.inicio >= g.nf ? '' : g.inicio; }
  else if (g.part === 'start'){ const ni = D.add(g.inicio, dlt); g.ni = ni >= g.fecha ? D.add(g.fecha, -1) : ni; g.nf = g.fecha; }
  // vista previa
  const geo = geom(g.nf, g.ni, S.gf, S.gdw, S.gdays);
  const ms = $('.ms', g.row), bar = $('.bar', g.row);
  if (ms) ms.style.left = geo.ms + 'px';
  if (bar){ if (geo.bar){ bar.style.display = ''; bar.style.left = geo.bar.left + 'px'; bar.style.width = geo.bar.width + 'px'; } else bar.style.display = 'none'; }
  const tip = $('#tip');
  tip.style.display = 'block'; tip.style.left = e.clientX + 'px'; tip.style.top = e.clientY + 'px';
  tip.textContent = g.part === 'start' ? 'Inicio: ' + D.short(g.ni) : 'Publica: ' + D.short(g.nf) + (D.valid(g.ni) && g.part === 'move' && g.ni < g.nf ? '  (desde ' + D.short(g.ni) + ')' : '');
}
function gUp(){
  const g = S.drag; if (!g) return;
  S.drag = null;
  document.body.classList.remove('dragging-g');
  $('#tip').style.display = 'none';
  if (!g.moved){ openDrawer(g.id); return; }
  const patch = {};
  if (g.nf !== g.fecha) patch.fecha = g.nf;
  if ((g.ni || '') !== (g.inicio || '')) patch.inicio = g.ni || '';
  if (Object.keys(patch).length){
    const it = byId(g.id);
    patchItem(g.id, patch, { undo: '“' + it.titulo + '” → ' + (patch.fecha ? D.short(patch.fecha) : 'inicio ' + D.short(patch.inicio)) });
  } else safeRender();
}

/* =====================================================================
   Exportar el Gantt a PDF: una sola hoja, A4/A3, a color y siempre en claro
   ===================================================================== */
const JSPDF_URL = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
let jspdfP = null;
function loadJsPDF(){
  if (window.jspdf && window.jspdf.jsPDF) return Promise.resolve(window.jspdf.jsPDF);
  if (!jspdfP) jspdfP = new Promise((res, rej) => {
    const sc = document.createElement('script');
    sc.src = JSPDF_URL;
    sc.onload = () => window.jspdf ? res(window.jspdf.jsPDF) : rej(new Error('el generador de PDF no cargó'));
    sc.onerror = () => { jspdfP = null; sc.remove(); rej(new Error('no se pudo cargar el generador de PDF. Revisá la conexión a internet.')); };
    document.head.appendChild(sc);
  });
  return jspdfP;
}
function ganttRows(){
  const [f, t] = range();
  const items = S.items.filter(i => passesFilters(i) && inRange(i, f, t)).sort(byDate);
  return { f, t, items, groups: ganttGroups(items) };
}
function filtersSummary(){
  const p = [];
  if (S.f.formato) p.push('Formato: ' + S.f.formato);
  if (S.f.red) p.push('Red: ' + S.f.red);
  if (S.f.resp) p.push('Responsable: ' + S.f.resp);
  if (S.f.q) p.push('Búsqueda: "' + S.f.q + '"');
  const hid = allEstados().filter(e => S.hidden.has(e) && e !== 'ELIMINADO');
  if (hid.length) p.push('Sin: ' + hid.join(', '));
  if (S.group !== 'none') p.push('Agrupado por ' + S.group);
  return p.join('  ·  ');
}
const SHEET_CAP = { a4: { h: 55, v: 90 }, a3: { h: 85, v: 130 } };
function openExport(){ paintExport(); $('#expModal').hidden = false; setTimeout(() => $('#expGo').focus(), 30); }
function closeExport(){ $('#expModal').hidden = true; }
function paintExport(){
  const { size, orient } = S.exp;
  $$('#expModal .seg[data-opt]').forEach(seg => $$('button', seg).forEach(b => b.setAttribute('aria-pressed', S.exp[seg.dataset.opt] === b.dataset.v)));
  // miniatura de la hoja
  const big = size === 'a3' ? 1 : 0.82, land = orient === 'h';
  const sh = $('#expSheet');
  sh.style.width = Math.round((land ? 118 : 84) * big) + 'px';
  sh.style.height = Math.round((land ? 84 : 118) * big) + 'px';
  const cols = ['#22C55E', '#EAB308', '#3B82F6', '#A855F7', '#EAB308', '#94A3B8'];
  sh.innerHTML = '<i></i>' + cols.map((c, i) => '<b style="background:' + c + ';opacity:.75;width:' + (20 + i * 9) + '%;margin-left:' + (8 + i * 9) + '%"></b>').join('') + '<span class="cap">' + size.toUpperCase() + '</span>';
  // texto
  const g = ganttRows();
  const n = g.items.length, rows = n + (S.group === 'none' ? 0 : g.groups.length);
  const fs = filtersSummary();
  let info = 'Se exporta lo que estás viendo: <b>' + esc(periodLabel()) + '</b>' + (fs ? ' · ' + esc(fs) : '') +
    ' · <b>' + n + '</b> contenido' + (n === 1 ? '' : 's') + ' en una sola hoja ' + size.toUpperCase() + ' ' + (land ? 'horizontal' : 'vertical') + ', a color.';
  if (!n) info += '<span class="exp-warn">No hay contenidos en este período con los filtros actuales.</span>';
  else if (rows > SHEET_CAP[size][orient]){
    const alt = [size === 'a4' ? 'A3' : '', land ? 'vertical' : '', 'un período más corto'].filter(Boolean);
    info += '<span class="exp-warn">Son muchos contenidos para una hoja y el texto va a quedar chico. Probá ' + alt.slice(0, -1).join(', ') + (alt.length > 1 ? ' o ' : '') + alt[alt.length - 1] + '.</span>';
  }
  $('#expInfo').innerHTML = info;
  const go = $('#expGo');
  go.disabled = !n;
  go.innerHTML = IC.download + ' Descargar PDF';
}
async function doExport(){
  const go = $('#expGo');
  go.disabled = true; go.textContent = 'Generando…';
  try {
    const { doc, name } = await buildGanttPDF(S.exp.size, S.exp.orient);
    try { doc.save(name); } catch (e){ window.open(doc.output('bloburl'), '_blank'); }
    closeExport();
    toast('PDF listo: ' + name);
  } catch (e){
    toast('No se pudo exportar: ' + ((e && e.message) || e), { kind: 'err' });
  } finally { paintExport(); }
}

// jsPDF usa las fuentes estándar (WinAnsi): se limpian caracteres que no puede dibujar
const pdfTxt = s => String(s ?? '').replace(/[–—]/g, '-').replace(/[“”]/g, '"').replace(/[‘’]/g, "'").replace(/…/g, '...').replace(/[^\x20-\x7E\xA0-\xFF]/g, '').trim();
function hexRgb(h){
  h = String(h || '#94A3B8').replace('#', '');
  if (h.length === 3) h = h.replace(/./g, c => c + c);
  const n = parseInt(h, 16);
  return isNaN(n) ? [148, 163, 184] : [n >> 16 & 255, n >> 8 & 255, n & 255];
}
const tint = (rgb, k) => rgb.map(v => Math.round(v + (255 - v) * k));
function fitTxt(doc, s, w){
  if (doc.getTextWidth(s) <= w) return s;
  while (s.length > 1 && doc.getTextWidth(s + '...') > w) s = s.slice(0, -1);
  return s.trimEnd() + '...';
}
function pdfDiamond(doc, cx, cy, r, rgb, filled){
  doc.setLineWidth(filled ? 0.18 : 0.3);
  doc.setDrawColor(...(filled ? [255, 255, 255] : rgb));
  doc.setFillColor(...rgb);
  doc.lines([[r, r], [-r, r], [-r, -r], [r, -r]], cx, cy - r, [1, 1], filled ? 'FD' : 'S', true);
}
async function buildGanttPDF(size, orient){
  const JsPDF = await loadJsPDF();
  const land = orient !== 'v';
  const doc = new JsPDF({ orientation: land ? 'landscape' : 'portrait', unit: 'mm', format: size, compress: true });
  const PW = doc.internal.pageSize.getWidth(), PH = doc.internal.pageSize.getHeight();
  const k = size === 'a3' ? 1.3 : 1;          // escala de textos y márgenes
  const M = 9 * k;
  const INK = [21, 25, 34], MUTED = [90, 99, 113], FAINT = [139, 147, 159], LINE = [214, 219, 226], GRID = [234, 237, 241];
  const { f, t, items, groups } = ganttRows();
  const days = D.diff(f, t) + 1, today = D.today();
  doc.setProperties({ title: 'Gantt de contenidos - ' + pdfTxt(periodLabel()), creator: 'Calendario de contenidos' });

  // ----- encabezado
  doc.setFont('helvetica', 'bold'); doc.setFontSize(15 * k); doc.setTextColor(...INK);
  doc.text('Calendario de contenidos', M, M + 4.5 * k);
  const now = new Date();
  doc.setFont('helvetica', 'normal'); doc.setFontSize(7.5 * k); doc.setTextColor(...FAINT);
  doc.text('Generado ' + p2(now.getDate()) + '/' + p2(now.getMonth() + 1) + '/' + now.getFullYear() + ' ' + p2(now.getHours()) + ':' + p2(now.getMinutes()), PW - M, M + 4.5 * k, { align: 'right' });
  doc.setFontSize(9 * k); doc.setTextColor(...MUTED);
  const fs = filtersSummary();
  const sub = periodLabel() + '·  ' + items.length + ' contenido' + (items.length === 1 ? '' : 's') + (fs ? '  ·  ' + fs : '');
  doc.setFont('helvetica', 'bold'); doc.setTextColor(...INK);
  const pl = pdfTxt(periodLabel());
  doc.text(pl, M, M + 10.5 * k);
  const plW = doc.getTextWidth(pl);
  doc.setFont('helvetica', 'normal'); doc.setTextColor(...MUTED);
  const gapW = doc.getTextWidth('  ');
  doc.text(fitTxt(doc, pdfTxt(sub.slice(periodLabel().length)), PW - 2 * M - plW - gapW), M + plW + gapW, M + 10.5 * k);

  // ----- leyenda de estados presentes
  const present = allEstados().filter(e => items.some(i => (i.estado || 'Idea') === e));
  let lx = M, ly = M + 16.5 * k;
  doc.setFontSize(7.5 * k);
  present.forEach(e => {
    const lbl = pdfTxt(e), w = doc.getTextWidth(lbl) + 8 * k;
    if (lx + w > PW - M){ lx = M; ly += 4.6 * k; }
    pdfDiamond(doc, lx + 1.5 * k, ly - 0.95 * k, 1.35 * k, hexRgb(colorOf(e)), !DEAD.includes(e));
    doc.setTextColor(...MUTED); doc.text(lbl, lx + 4 * k, ly);
    lx += w;
  });

  // ----- geometría del gráfico
  const top = ly + 3.5 * k;
  const bottom = PH - M - 5 * k;
  const LW = (land ? 68 : 60) * k;
  const x0 = M + LW, tw = PW - M - x0, dw = tw / days;
  const monthH = 5.5 * k, dayH = dw >= 3.4 ? 7 * k : 4.8 * k;
  const hy = top + monthH + dayH;
  const rowsArr = [];
  groups.forEach(([gk, list]) => { if (gk) rowsArr.push({ grp: gk, n: list.length }); list.forEach(it => rowsArr.push({ it })); });
  const rowH = rowsArr.length ? Math.min(7 * k, (bottom - hy) / rowsArr.length) : 7 * k;
  const ey = hy + rowsArr.length * rowH;

  // filas cebra
  rowsArr.forEach((r, i) => { if (!r.grp && i % 2){ doc.setFillColor(250, 251, 252); doc.rect(M, hy + i * rowH, PW - 2 * M, rowH, 'F'); } });
  // fines de semana y días futuros sin contenido
  const cnt = {};
  S.items.forEach(i => { if (passesFilters(i) && D.valid(i.fecha) && !DEAD.includes(i.estado)) cnt[i.fecha] = (cnt[i.fecha] || 0) + 1; });
  for (let i = 0, d = f; i < days; i++, d = D.add(d, 1)){
    const wd = D.dow(d);
    if (wd === 0 || wd === 6){ doc.setFillColor(242, 243, 246); doc.rect(x0 + i * dw, top + monthH, dw, ey - top - monthH, 'F'); }
    else if (!cnt[d] && d >= today){ doc.setFillColor(255, 246, 222); doc.rect(x0 + i * dw, top + monthH, dw, ey - top - monthH, 'F'); }
  }
  // filas de grupo
  rowsArr.forEach((r, i) => { if (r.grp){ doc.setFillColor(238, 241, 245); doc.rect(M, hy + i * rowH, PW - 2 * M, rowH, 'F'); } });
  // líneas de días
  if (dw >= 1.6){
    doc.setDrawColor(...GRID); doc.setLineWidth(0.1);
    for (let i = 1; i < days; i++) doc.line(x0 + i * dw, top + monthH, x0 + i * dw, ey);
  }
  // líneas de filas
  if (rowH >= 2.2){
    doc.setDrawColor(...GRID); doc.setLineWidth(0.1);
    for (let i = 1; i < rowsArr.length; i++) doc.line(M, hy + i * rowH, PW - M, hy + i * rowH);
  }

  // ----- cabecera de meses y días
  const dfs = Math.max(3, Math.min(6.5 * k, dw * 2.835 * 0.5));
  for (let i = 0, d = f; i < days; i++, d = D.add(d, 1)){
    const x = x0 + i * dw, wd = D.dow(d);
    if (i === 0 || D.d(d) === 1){
      const end = Math.min(D.diff(f, D.mEnd(d)) + 1, days), w = (end - i) * dw;
      if (i){ doc.setDrawColor(...LINE); doc.setLineWidth(0.25); doc.line(x, top, x, ey); }
      doc.setFont('helvetica', 'bold'); doc.setFontSize(7.5 * k); doc.setTextColor(...INK);
      const lbl = w > 30 * k ? MONL[D.m(d)] + ' ' + D.y(d) : w > 9 * k ? MONL[D.m(d)].slice(0, 3) : '';
      if (lbl) doc.text(fitTxt(doc, lbl, w - 2), x + 1.5, top + monthH - 1.6 * k);
    }
    const sparse = dw < 2.4, showN = !sparse || wd === 1;
    doc.setFontSize(sparse ? 5.5 * k : dfs);
    if (dw >= 3.4){
      doc.setFont('helvetica', 'normal'); doc.setTextColor(...FAINT);
      doc.text('DLMMJVS'.charAt(wd), x + dw / 2, top + monthH + 2.7 * k, { align: 'center' });
    }
    if (showN){
      const ny = top + monthH + dayH - 1.5 * k;
      if (d === today){
        doc.setFillColor(229, 72, 77);
        const bw = Math.max(dw - 0.5, doc.getTextWidth(String(D.d(d))) + 1.2), bh = dfs * 0.3528 + 1.2;
        doc.roundedRect(x + dw / 2 - bw / 2, ny - bh + 0.6, bw, bh, 0.6, 0.6, 'F');
        doc.setFont('helvetica', 'bold'); doc.setTextColor(255, 255, 255);
      } else { doc.setFont('helvetica', 'bold'); doc.setTextColor(...INK); }
      doc.text(String(D.d(d)), x + dw / 2, ny, { align: 'center' });
    }
  }
  // títulos de columnas de la etiqueta
  doc.setFont('helvetica', 'bold'); doc.setFontSize(6.5 * k); doc.setTextColor(...FAINT);
  doc.text('CONTENIDO', M + 2, hy - 1.8 * k);
  doc.text('FECHA', x0 - 2, hy - 1.8 * k, { align: 'right' });

  // marco
  doc.setDrawColor(...LINE); doc.setLineWidth(0.25);
  doc.line(x0, top + monthH, PW - M, top + monthH);
  doc.line(M, hy, PW - M, hy);
  doc.line(x0, top, x0, Math.max(ey, hy));
  doc.rect(M, top, PW - 2 * M, Math.max(ey, hy) - top, 'S');

  // hoy
  if (today >= f && today <= t && rowsArr.length){
    const x = x0 + (D.diff(f, today) + 0.5) * dw;
    doc.setDrawColor(229, 72, 77); doc.setLineWidth(0.35);
    doc.line(x, hy, x, ey);
  }

  // ----- filas
  const lfs = Math.max(2.4, Math.min(8 * k, rowH * 2.835 * 0.56));
  rowsArr.forEach((r, i) => {
    const y = hy + i * rowH, cy = y + rowH / 2;
    if (r.grp){
      doc.setFont('helvetica', 'bold'); doc.setFontSize(lfs); doc.setTextColor(...MUTED);
      let tx = M + 2;
      if (S.group === 'estado'){ doc.setFillColor(...hexRgb(colorOf(r.grp))); doc.circle(M + 2.8, cy, Math.min(1.1 * k, rowH * 0.22), 'F'); tx = M + 5; }
      doc.text(fitTxt(doc, pdfTxt(r.grp.toUpperCase() + '  ·  ' + r.n), LW - 6), tx, cy, { baseline: 'middle' });
      return;
    }
    const it = r.it, est = it.estado || 'Idea', rgb = hexRgb(colorOf(est)), dead = DEAD.includes(est);
    doc.setFillColor(...rgb); doc.circle(M + 2.8, cy, Math.min(1.1 * k, rowH * 0.22), 'F');
    doc.setFont('helvetica', 'normal'); doc.setFontSize(lfs);
    const dTxt = p2(D.d(it.fecha)) + '/' + p2(D.m(it.fecha) + 1);
    const dW = doc.getTextWidth(dTxt);
    doc.setTextColor(...FAINT); doc.text(dTxt, x0 - 2, cy, { align: 'right', baseline: 'middle' });
    doc.setFont('helvetica', dead ? 'normal' : 'bold'); doc.setTextColor(...(dead ? FAINT : INK));
    const title = fitTxt(doc, pdfTxt(it.titulo) || '(sin título)', LW - dW - 10);
    doc.text(title, M + 5, cy, { baseline: 'middle' });
    if (dead){ doc.setDrawColor(...FAINT); doc.setLineWidth(0.15); doc.line(M + 5, cy, M + 5 + doc.getTextWidth(title), cy); }
    // barra de producción
    if (D.valid(it.inicio) && it.inicio < it.fecha){
      const s0 = Math.max(D.diff(f, it.inicio), 0), e0 = Math.min(D.diff(f, it.fecha), days - 1);
      if (e0 >= s0){
        const bh = Math.max(0.8, rowH * 0.46), rr = Math.min(0.8, bh / 2);
        doc.setFillColor(...tint(rgb, 0.72)); doc.setDrawColor(...tint(rgb, 0.2)); doc.setLineWidth(0.15);
        doc.roundedRect(x0 + s0 * dw + 0.2, cy - bh / 2, Math.max((e0 - s0 + 1) * dw - 0.4, 0.6), bh, rr, rr, 'FD');
      }
    }
    // rombo de publicación
    if (it.fecha <= t){
      const rd = Math.max(0.6, Math.min(rowH * 0.36, 2.1 * k, Math.max(dw * 0.5, 1)));
      pdfDiamond(doc, x0 + (D.diff(f, it.fecha) + 0.5) * dw, cy, rd, rgb, !dead);
    }
  });
  if (!rowsArr.length){
    doc.setFont('helvetica', 'normal'); doc.setFontSize(10 * k); doc.setTextColor(...MUTED);
    doc.text('No hay contenidos en este período con los filtros actuales.', PW / 2, hy + 14 * k, { align: 'center' });
  }

  // ----- pie
  doc.setFont('helvetica', 'normal'); doc.setFontSize(6.8 * k); doc.setTextColor(...FAINT);
  const fy = PH - M + 0.5 * k;
  doc.text('Rombo: fecha de publicación  ·  Barra: período de producción  ·  Línea roja: hoy  ·  Amarillo: días sin contenido', M, fy);
  doc.text('Marketing · Publicidad digital', PW - M, fy, { align: 'right' });

  const name = 'Gantt ' + f + ' a ' + t + ' (' + size.toUpperCase() + ' ' + (land ? 'horizontal' : 'vertical') + ').pdf';
  return { doc, name };
}

/* =====================================================================
   Operaciones (optimistas, en cola para no pisarse)
   ===================================================================== */
let Q = Promise.resolve();
let flashId = null;
function enqueue(fn){
  S.inflight++; setSync('saving');
  const p = Q.then(fn).finally(() => { S.inflight--; if (!S.inflight && S.sync !== 'error') setSync('ok'); if (!S.inflight && S.dirty) safeRender(); });
  Q = p.catch(() => {});
  return p;
}
function noteRev(rev){ if (rev === S.rev + 1) S.rev = rev; }
function merge(item){ const it = byId(item.id); if (it) Object.assign(it, item); else S.items.push(item); }
function fail(e){ setSync('error'); toast('No se pudo guardar: ' + ((e && e.message) || e), { kind: 'err' }); }
function movePatch(it, fecha){
  const p = { fecha };
  if (D.valid(it.inicio) && D.valid(it.fecha) && D.valid(fecha) && it.inicio < it.fecha) p.inicio = D.add(it.inicio, D.diff(it.fecha, fecha));
  return p;
}
function patchItem(id, patch, o = {}){
  const it = byId(id); if (!it) return;
  const before = {}; Object.keys(patch).forEach(k => before[k] = it[k] ?? '');
  if (Object.keys(patch).every(k => (it[k] ?? '') === (patch[k] ?? ''))) return;
  Object.assign(it, patch);
  safeRender(); refreshDrawer();
  return enqueue(async () => {
    try {
      const cur = byId(id);
      const r = await api.updateItem(id, patch, cur ? cur.version : 0, S.user);
      merge(r.item); noteRev(r.rev); refreshDrawer();
      if (r.conflicted) toast('Alguien más editó “' + r.item.titulo + '” hace un momento. Se guardó tu cambio; revisalo.', { kind: 'warn' });
      if (o.undo) toast(o.undo, { action: 'Deshacer', onAction: () => patchItem(id, before) });
    } catch (e){ const c = byId(id); if (c) Object.assign(c, before); S.dirty = true; refreshDrawer(); fail(e); }
  });
}
function patchMany(changes, undoMsg){
  const befores = changes.map(c => { const it = byId(c.id); const b = {}; Object.keys(c.patch).forEach(k => b[k] = it[k] ?? ''); Object.assign(it, c.patch); return { id: c.id, patch: b }; });
  safeRender(); refreshDrawer();
  return enqueue(async () => {
    try {
      const r = await api.updateMany(changes.map(c => ({ id: c.id, patch: c.patch, baseVersion: byId(c.id).version })), S.user);
      r.items.forEach(merge); noteRev(r.rev); refreshDrawer();
      if (undoMsg) toast(undoMsg, { action: 'Deshacer', onAction: () => patchMany(befores) });
    } catch (e){ befores.forEach(b => { const it = byId(b.id); if (it) Object.assign(it, b.patch); }); S.dirty = true; refreshDrawer(); fail(e); }
  });
}
function moveTo(id, fecha){
  const it = byId(id); if (!it || (it.fecha || '') === (fecha || '')) return;
  flashId = id;
  patchItem(id, movePatch(it, fecha), { undo: '“' + it.titulo + '” → ' + (fecha ? D.short(fecha) : 'sin fecha') });
}
function swapDates(a, b){
  const A = byId(a), B = byId(b); if (!A || !B) return;
  patchMany([{ id: a, patch: movePatch(A, B.fecha) }, { id: b, patch: movePatch(B, A.fecha) }],
    'Intercambiados: “' + A.titulo + '” ↔ “' + B.titulo + '”');
}
function createItem(data){
  return enqueue(async () => {
    try {
      const r = await api.createItem(data, S.user);
      merge(r.item); noteRev(r.rev); flashId = r.item.id;
      S.dirty = true;
      openDrawer(r.item.id);
      toast('Contenido creado para ' + D.short(r.item.fecha));
    } catch (e){ fail(e); }
  });
}
function deleteItem(id){
  const it = byId(id); if (!it) return;
  const idx = S.items.indexOf(it);
  S.items.splice(idx, 1); closeDrawer(); safeRender();
  enqueue(async () => {
    try { const r = await api.deleteItem(id, S.user); noteRev(r.rev); toast('Movido a la hoja Papelera: “' + it.titulo + '”'); }
    catch (e){ S.items.splice(idx, 0, it); S.dirty = true; fail(e); }
  });
}

/* =====================================================================
   Panel lateral de detalle / alta
   ===================================================================== */
function openNew(fecha){
  S.drawer = { draft: { titulo: '', fecha: fecha || D.today(), inicio: '', estado: 'Idea', formato: '', red: S.config.redes[0] || '', link: '', notas: '', responsable: S.user || '' } };
  renderDrawer();
  setTimeout(() => $('.dr-title') && $('.dr-title').focus(), 60);
}
function openDrawer(id){ S.drawer = { id }; renderDrawer(); }
function closeDrawer(){
  S.drawer = null;
  $('#drawer').classList.remove('on'); $('#scrim').classList.remove('on');
  $('#drawer').setAttribute('aria-hidden', 'true');
  if (S.dirty) safeRender();
}
function renderDrawer(){
  const dr = $('#drawer');
  if (!S.drawer) return;
  const isNew = !!S.drawer.draft;
  const it = isNew ? S.drawer.draft : byId(S.drawer.id);
  if (!it){ closeDrawer(); return; }
  const est = it.estado || 'Idea';
  let swap = '';
  if (!isNew && D.valid(it.fecha)){
    const near = S.items.filter(x => x.id !== it.id && D.valid(x.fecha) && Math.abs(D.diff(it.fecha, x.fecha)) <= 31 && x.fecha !== it.fecha && !DEAD.includes(x.estado)).sort(byDate);
    const closest = near.slice().sort((a, b) => Math.abs(D.diff(it.fecha, a.fecha)) - Math.abs(D.diff(it.fecha, b.fecha)))[0];
    swap = '<div class="dr-box"><span class="lbl">' + IC.swap + ' Intercambiar fecha con otro contenido</span>' +
      (near.length ? '<div class="inrow"><select id="swapSel">' + near.map(x => '<option value="' + esc(x.id) + '"' + (x === closest ? ' selected' : '') + '>' + esc(D.short(x.fecha) + ' · ' + x.titulo) + '</option>').join('') + '</select><button class="btn" id="swapBtn">Intercambiar</button></div>' +
        '<p class="hint">Este pasa a la fecha del otro y viceversa (±31 días).</p>' : '<p class="hint">No hay otros contenidos en ±31 días.</p>') + '</div>';
  }
  const meta = !isNew && (it.actualizado || it.por) ?
    '<p class="dr-meta">Última modificación' + (it.actualizado ? ' ' + fmtStamp(it.actualizado) : '') + (it.por ? ' · ' + esc(it.por) : '') + '</p>' : '';
  dr.innerHTML =
    '<div class="dr-head"><span class="dr-kicker">' + (isNew ? 'Nuevo contenido' : D.short(it.fecha)) + '</span><span class="spacer"></span><button class="icon-btn" id="drClose" title="Cerrar (Esc)">' + IC.x + '</button></div>' +
    '<div class="dr-body">' +
      '<input class="dr-title" data-f="titulo" value="' + esc(it.titulo) + '" placeholder="Nombre del contenido" aria-label="Contenido">' +
      '<div class="dr-grid">' +
        '<label class="fld">Fecha de publicación<input type="date" data-f="fecha" value="' + esc(it.fecha) + '"></label>' +
        '<label class="fld">Inicio de producción<input type="date" data-f="inicio" value="' + esc(it.inicio) + '"></label>' +
        '<label class="fld">Estado<span class="pill" style="--c:' + esc(colorOf(est)) + '"><select data-f="estado">' + estadoOptions(est) + '</select></span></label>' +
        '<label class="fld">Formato<select data-f="formato">' + opts(S.config.formatos, it.formato, '—') + '</select></label>' +
        '<label class="fld">Red<select data-f="red">' + opts(S.config.redes, it.red, '—') + '</select></label>' +
        '<label class="fld">Responsable<input data-f="responsable" list="dlResp" value="' + esc(it.responsable) + '" placeholder="Nombre"></label>' +
      '</div>' +
      '<label class="fld">Link de la publicación<span class="inrow"><input type="url" data-f="link" value="' + esc(it.link) + '" placeholder="https://www.instagram.com/…">' +
        (it.link ? '<a class="btn" href="' + esc(it.link) + '" target="_blank" rel="noopener">' + IC.open + '</a>' : '') + '</span></label>' +
      '<label class="fld">Notas / copy / brief<textarea data-f="notas" placeholder="Ideas, copy, pedidos al equipo…">' + esc(it.notas) + '</textarea></label>' +
      swap +
      (isNew ? '' : '<div class="dr-actions"><button class="btn" id="dupBtn">' + IC.copy + ' Duplicar</button><button class="btn danger" id="delBtn">' + IC.trash + ' Eliminar</button></div>') +
      meta +
    '</div>' +
    (isNew ? '<div class="dr-foot"><button class="btn" id="drCancel">Cancelar</button><button class="btn primary" id="createBtn">Crear contenido</button></div>' : '');
  dr.classList.add('on'); $('#scrim').classList.add('on'); dr.setAttribute('aria-hidden', 'false');
}
function refreshDrawer(){
  if (!S.drawer || S.drawer.draft) return;
  const it = byId(S.drawer.id);
  if (!it){ closeDrawer(); toast('Este contenido fue eliminado por otra persona.', { kind: 'warn' }); return; }
  const a = document.activeElement;
  if (a && $('#drawer').contains(a) && a.dataset.f){
    // no pisar lo que el usuario está escribiendo; actualizar el resto
    $$('[data-f]', $('#drawer')).forEach(el => { if (el !== a && el.value !== (it[el.dataset.f] ?? '')) el.value = it[el.dataset.f] ?? ''; });
    return;
  }
  const st = $('#drawer .dr-body').scrollTop;
  renderDrawer();
  $('#drawer .dr-body').scrollTop = st;
}
function fmtStamp(iso){
  const d = new Date(iso); if (isNaN(d)) return '';
  return p2(d.getDate()) + '/' + p2(d.getMonth() + 1) + ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes());
}

/* =====================================================================
   Sincronización
   ===================================================================== */
function setSync(s){
  S.sync = s;
  const el = $('#sync'); el.dataset.s = s;
  const n = new Date();
  $('span', el).textContent = s === 'ok' ? 'Sincronizado ' + p2(n.getHours()) + ':' + p2(n.getMinutes()) :
    s === 'saving' ? 'Guardando…' : s === 'error' ? 'Sin conexión · reintentando' : s === 'demo' ? 'Sin conectar · guardado en este navegador' : 'Conectando…';
  if (s === 'ok' && MODE === 'local'){ el.dataset.s = 'demo'; $('span', el).textContent = 'Sin conectar · guardado en este navegador'; }
}
function applyData(d){
  S.items = d.items || [];
  if (d.config) S.config = d.config;
  S.rev = d.rev;
  S.email = d.user || '';
  if (!S.user && S.email) S.user = S.email.split('@')[0];
  if (d.sheetUrl){ $('#sheetLink').href = d.sheetUrl; $('#sheetLink').hidden = false; }
  renderWho();
}
let polling = false;
async function poll(){
  if (polling || document.hidden || S.inflight || S.drag) return;
  polling = true;
  try {
    const rev = await api.getRev();
    if (rev !== S.rev && !S.inflight){
      const d = await api.getData();
      if (!S.inflight){ applyData(d); S.dirty = true; safeRender(); refreshDrawer(); }
    }
    if (S.sync !== 'saving') setSync('ok');
  } catch (e){ setSync('error'); }
  polling = false;
}

/* =====================================================================
   Quién soy (queda registrado en cada cambio)
   ===================================================================== */
function renderWho(){
  const w = $('#whoWrap');
  if (S.editingWho){
    w.innerHTML = '<input id="whoInput" placeholder="Tu nombre" value="' + esc(S.user) + '" maxlength="40">';
    const i = $('#whoInput'); i.focus(); i.select();
    const done = () => { S.user = i.value.trim(); S.editingWho = false; savePrefs(); renderWho(); };
    i.addEventListener('keydown', e => { if (e.key === 'Enter') done(); if (e.key === 'Escape'){ S.editingWho = false; renderWho(); } });
    i.addEventListener('blur', done);
    return;
  }
  const n = S.user;
  w.innerHTML = '<button class="chip-btn' + (n ? '' : ' ask') + '" id="whoBtn" title="Tu nombre queda registrado en cada cambio. Clic para cambiarlo.">' +
    '<span class="av">' + esc(n ? n.slice(0, 1).toUpperCase() : '?') + '</span><span>' + esc(n || '¿Quién sos?') + '</span></button>';
}

/* =====================================================================
   Toasts
   ===================================================================== */
function toast(msg, o = {}){
  const box = $('#toasts');
  const el = document.createElement('div');
  el.className = 'toast' + (o.kind ? ' ' + o.kind : '');
  el.innerHTML = '<span>' + esc(msg) + '</span>' + (o.action ? '<button>' + esc(o.action) + '</button>' : '');
  if (o.action) $('button', el).onclick = () => { el.remove(); o.onAction(); };
  box.appendChild(el);
  while (box.children.length > 3) box.firstChild.remove();
  setTimeout(() => el.remove(), o.kind === 'err' ? 8000 : 6000);
}

/* =====================================================================
   Eventos
   ===================================================================== */
function bindUI(){
  $$('.tab').forEach(b => b.onclick = () => { S.view = b.dataset.view; S.scrollToToday = true; renderAll(); });
  $('#modeSeg').onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    const [f, t] = range();
    if (b.dataset.mode === 'rango' && S.period.mode !== 'rango'){ S.period.from = f; S.period.to = t; }
    if (S.period.mode === 'rango' && b.dataset.mode !== 'rango') S.period.anchor = f;
    if (S.period.mode === 'todo') S.period.anchor = D.today();
    S.period.mode = b.dataset.mode; S.scrollToToday = true; renderAll();
  };
  $('#prev').onclick = () => shiftPeriod(-1);
  $('#next').onclick = () => shiftPeriod(1);
  $('#todayBtn').onclick = () => {
    if (S.period.mode === 'rango'){ const n = D.diff(...range()); S.period.from = D.today(); S.period.to = D.add(D.today(), n); }
    else if (S.period.mode !== 'todo') S.period.anchor = D.today();
    S.scrollToToday = true; renderAll();
    const el = $('.day.today'); if (el && S.view === 'lista') el.scrollIntoView({ block: 'center', behavior: 'smooth' });
  };
  $('#jump').onchange = e => { if (!D.valid(e.target.value)) return; if (S.period.mode === 'todo') S.period.mode = 'dia'; S.period.anchor = e.target.value; renderAll(); };
  $('#rFrom').onchange = e => { if (D.valid(e.target.value)){ S.period.from = e.target.value; renderAll(); } };
  $('#rTo').onchange = e => { if (D.valid(e.target.value)){ S.period.to = e.target.value; renderAll(); } };
  let qT; $('#q').oninput = e => { clearTimeout(qT); qT = setTimeout(() => { S.f.q = e.target.value.trim().toLowerCase(); renderStrip(); S.view === 'lista' ? renderList() : renderGantt(); }, 120); };
  $('#fFormato').onchange = e => { S.f.formato = e.target.value; renderAll(); };
  $('#fRed').onchange = e => { S.f.red = e.target.value; renderAll(); };
  $('#fResp').onchange = e => { S.f.resp = e.target.value; renderAll(); };

  // chips de estado
  let clickT;
  $('#strip').onclick = e => {
    const p = e.target.closest('[data-preset]');
    if (p){
      S.hidden = new Set(p.dataset.preset === 'all' ? ['ELIMINADO'] : [...DONE, ...DEAD, 'Aceptada']);
      return renderAll();
    }
    const c = e.target.closest('.schip'); if (!c) return;
    clearTimeout(clickT);
    clickT = setTimeout(() => { const k = c.dataset.est; S.hidden.has(k) ? S.hidden.delete(k) : S.hidden.add(k); renderAll(); }, 200);
  };
  $('#strip').ondblclick = e => {
    const c = e.target.closest('.schip'); if (!c) return;
    clearTimeout(clickT);
    S.hidden = new Set(allEstados().filter(x => x !== c.dataset.est)); renderAll();
  };

  $('#btnNew').onclick = () => openNew(S.period.mode === 'dia' ? S.period.anchor : D.today());
  $('#whoWrap').onclick = e => { if (e.target.closest('#whoBtn')){ S.editingWho = true; renderWho(); } };

  const main = $('#main');
  // ediciones en línea (lista)
  main.addEventListener('change', e => {
    const el = e.target;
    if (el.dataset.move){ if (D.valid(el.value)) moveTo(el.dataset.move, el.value); return; }
    if (el.id === 'gGroup'){ S.group = el.value; renderAll(); return; }
    const f = el.dataset.f, row = el.closest('.row'); if (!f || !row) return;
    let v = el.value; if (f === 'titulo'){ v = v.trim(); if (!v){ el.value = byId(row.dataset.id).titulo; return; } }
    patchItem(row.dataset.id, { [f]: v }, f === 'estado' ? { undo: 'Estado → ' + v } : {});
  });
  main.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('.row input')) e.target.blur(); });
  main.addEventListener('focusout', () => setTimeout(() => { if (S.dirty && !isEditing()) safeRender(); }, 50));
  main.addEventListener('click', e => {
    const a = e.target.closest('[data-act]');
    if (a && a.dataset.act === 'add') return openNew(a.dataset.date);
    if (a && a.dataset.act === 'export') return openExport();
    if (a && a.dataset.act === 'seed'){
      a.disabled = true; a.textContent = 'Cargando…';
      const list = SEED.map(({ id, version, actualizado, por, ...rest }) => rest);
      enqueue(async () => {
        try { const r = await api.createMany(list, S.user); r.items.forEach(merge); noteRev(r.rev); S.dirty = true; toast(r.items.length + ' contenidos cargados en la planilla'); }
        catch (e){ fail(e); S.dirty = true; }
      });
      return;
    }
    if (a && a.dataset.act === 'open') return openDrawer(a.closest('.row').dataset.id);
    const z = e.target.closest('[data-zoom]');
    if (z){ const k = +z.dataset.zoom; S.gz = k === 0 ? null : Math.max(8, Math.min(90, Math.round((S.gdw || 30) * (k > 0 ? 1.3 : 0.77)))); renderAll(); return; }
    const lab = e.target.closest('[data-open]'); if (lab) return openDrawer(lab.dataset.open);
    const day = e.target.closest('[data-day]');
    if (day){ S.period.mode = 'dia'; S.period.anchor = day.dataset.day; S.view = 'lista'; renderAll(); window.scrollTo(0, 0); }
  });
  // arrastrar filas entre días (lista)
  main.addEventListener('dragstart', e => {
    const g = e.target.closest('.grip'); if (!g) return;
    const row = g.closest('.row');
    e.dataTransfer.setData('text/plain', row.dataset.id); e.dataTransfer.effectAllowed = 'move';
    try { e.dataTransfer.setDragImage(row, 20, 18); } catch(_){}
    setTimeout(() => row.classList.add('dragging'), 0);
  });
  main.addEventListener('dragend', () => { $$('.dragging, .drop').forEach(x => x.classList.remove('dragging', 'drop')); });
  main.addEventListener('dragover', e => {
    const d = e.target.closest('.day'); if (!d) return;
    e.preventDefault(); e.dataTransfer.dropEffect = 'move';
    $$('.day.drop').forEach(x => x !== d && x.classList.remove('drop')); d.classList.add('drop');
  });
  main.addEventListener('drop', e => {
    const d = e.target.closest('.day'); if (!d) return;
    e.preventDefault(); d.classList.remove('drop');
    const id = e.dataTransfer.getData('text/plain'); if (id) moveTo(id, d.dataset.date);
  });
  // Gantt
  main.addEventListener('pointerdown', gDown);
  window.addEventListener('pointermove', gMove);
  window.addEventListener('pointerup', gUp);
  window.addEventListener('pointercancel', gUp);

  // panel lateral
  const dr = $('#drawer');
  $('#scrim').onclick = () => { if (!S.drawer || !S.drawer.draft || !S.drawer.draft.titulo) closeDrawer(); };
  dr.addEventListener('click', e => {
    if (e.target.closest('#drClose') || e.target.closest('#drCancel')) return closeDrawer();
    if (e.target.closest('#createBtn')){
      const d = S.drawer.draft; $$('[data-f]', dr).forEach(el => d[el.dataset.f] = el.value.trim());
      if (!d.titulo){ $('.dr-title').focus(); toast('Poné un nombre al contenido', { kind: 'warn' }); return; }
      createItem(d); return;
    }
    if (e.target.closest('#swapBtn')) return swapDates(S.drawer.id, $('#swapSel').value);
    if (e.target.closest('#dupBtn')){
      const it = byId(S.drawer.id);
      const copy = {}; ['fecha','titulo','estado','formato','red','link','notas','inicio','responsable'].forEach(k => copy[k] = it[k]);
      copy.titulo += ' (copia)'; copy.link = ''; copy.estado = 'Idea';
      createItem(copy); return;
    }
    const del = e.target.closest('#delBtn');
    if (del){
      if (!del.classList.contains('armed')){ del.classList.add('armed'); del.lastChild.textContent = ' ¿Seguro? Clic de nuevo'; setTimeout(() => { if (del.isConnected){ del.classList.remove('armed'); del.lastChild.textContent = ' Eliminar'; } }, 4000); return; }
      deleteItem(S.drawer.id);
    }
  });
  dr.addEventListener('change', e => {
    const f = e.target.dataset.f; if (!f || !S.drawer) return;
    const v = e.target.value.trim();
    if (S.drawer.draft){ S.drawer.draft[f] = v; if (f === 'estado') e.target.parentNode.style.setProperty('--c', colorOf(v)); return; }
    const it = byId(S.drawer.id); if (!it) return;
    if (f === 'estado') e.target.parentNode.style.setProperty('--c', colorOf(v));
    if (f === 'titulo' && !v){ e.target.value = it.titulo; return; }
    if (f === 'fecha') moveTo(it.id, v);
    else patchItem(it.id, { [f]: v });
  });
  dr.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('input')) e.target.blur(); });

  // atajos de teclado
  document.addEventListener('keydown', e => {
    if (!$('#expModal').hidden){ if (e.key === 'Escape') closeExport(); return; }
    if (e.key === 'Escape' && S.drawer){ closeDrawer(); return; }
    if (/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName) || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === '/'){ e.preventDefault(); $('#q').focus(); }
    else if (e.key === 'n' || e.key === 'N'){ e.preventDefault(); $('#btnNew').click(); }
    else if (e.key === 't' || e.key === 'T') $('#todayBtn').click();
    else if (e.key === 'ArrowLeft' && !S.drawer) shiftPeriod(-1);
    else if (e.key === 'ArrowRight' && !S.drawer) shiftPeriod(1);
    else if (e.key === 'g' || e.key === 'G'){ S.view = S.view === 'lista' ? 'gantt' : 'lista'; renderAll(); }
  });
  // tema
  const paintTheme = () => { $('#themeBtn').innerHTML = S.theme === 'dark' ? IC.sun : IC.moon; };
  paintTheme();
  $('#themeBtn').onclick = () => { S.theme = S.theme === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = S.theme; paintTheme(); savePrefs(); };
  // exportar
  const em = $('#expModal');
  em.addEventListener('click', e => {
    if (e.target === em || e.target.closest('[data-x]')) return closeExport();
    const b = e.target.closest('.seg[data-opt] button');
    if (b){ S.exp[b.parentNode.dataset.opt] = b.dataset.v; savePrefs(); paintExport(); return; }
    if (e.target.closest('#expGo')) doExport();
  });
  let rT; window.addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(() => { if (S.view === 'gantt') safeRender(); }, 150); });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });
}

/* =====================================================================
   Arranque
   ===================================================================== */
async function init(){
  try {
    const d = await api.getData();
    applyData(d);
    S.ready = true;
    renderAll();
    setSync('ok');
    clearInterval(pollTimer); pollTimer = setInterval(poll, 12000);
  } catch (e){
    setSync('error');
    $('#main').innerHTML = '<div class="fatal"><h3 style="margin-top:0">No se pudo conectar con la planilla</h3><p>' + esc((e && e.message) || e) + '</p>' +
      '<p style="color:var(--muted)">En Apps Script: <b>Implementar › Administrar implementaciones › ✏️</b> → "Quién tiene acceso: <b>Cualquier persona</b>" y <b>Versión: Nueva versión</b>. Si la planilla es nueva, ejecutá antes la función <code>setup</code>.</p>' +
      '<p><button class="btn primary" id="retryBtn">Reintentar</button> <button class="btn" id="offlineBtn">Usar sin conexión (solo en este navegador)</button></p></div>';
    $('#retryBtn').onclick = () => { $('#main').innerHTML = '<div class="loading"><div class="spin"></div>Conectando…</div>'; init(); };
    $('#offlineBtn').onclick = () => { MODE = 'local'; api = demoApi(); init(); };
  }
}
let pollTimer = null;
bindUI();
init();
</script>
</body>
</html>
