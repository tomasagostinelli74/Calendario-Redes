<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calendario de contenidos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f5f7; --surface:#ffffff; --surface-2:#f1f3f6; --surface-3:#e7eaef;
  --border:#e1e4e9; --border-strong:#cdd2da; --grid:#eceef2;
  --text:#151922; --muted:#5a6371; --faint:#8b939f;
  --accent:#2747d6; --accent-soft:#e9edfc; --accent-ink:#ffffff;
  --today:#e5484d; --today-soft:#fdecec;
  --gap:#fff4d6; --gap-ink:#9a6700; --weekend:#f6f7f9;
  --ok:#1a7f4b; --warn:#b26b00; --err:#c4312b;
  --shadow-sm:0 1px 2px rgba(16,24,40,.06);
  --shadow:0 2px 6px rgba(16,24,40,.06),0 12px 32px rgba(16,24,40,.10);
  --radius:10px;
  --head-h:60px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1014; --surface:#161920; --surface-2:#1c2028; --surface-3:#252a34;
    --border:#272c36; --border-strong:#353b47; --grid:#1f232b;
    --text:#e7e9ee; --muted:#9ba3af; --faint:#6f7784;
    --accent:#7090ff; --accent-soft:#1f2747; --accent-ink:#0e1014;
    --today:#ff6b6f; --today-soft:#3a1d20;
    --gap:#2e2614; --gap-ink:#e3b341; --weekend:#13161c;
    --ok:#3fb950; --warn:#e3b341; --err:#ff7b72;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --shadow:0 2px 6px rgba(0,0,0,.35),0 12px 32px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1014; --surface:#161920; --surface-2:#1c2028; --surface-3:#252a34;
  --border:#272c36; --border-strong:#353b47; --grid:#1f232b;
  --text:#e7e9ee; --muted:#9ba3af; --faint:#6f7784;
  --accent:#7090ff; --accent-soft:#1f2747; --accent-ink:#0e1014;
  --today:#ff6b6f; --today-soft:#3a1d20;
  --gap:#2e2614; --gap-ink:#e3b341; --weekend:#13161c;
  --ok:#3fb950; --warn:#e3b341; --err:#ff7b72;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow:0 2px 6px rgba(0,0,0,.35),0 12px 32px rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.4 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
svg{display:block}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- header */
.top{position:sticky;top:0;z-index:40;height:var(--head-h);display:flex;align-items:center;gap:16px;padding:0 20px;background:var(--surface);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:32px;height:32px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.brand h1{font-size:15px;font-weight:650;margin:0;white-space:nowrap;letter-spacing:-.01em}
.brand p{margin:0;font-size:12px;color:var(--muted);white-space:nowrap}
.tabs{display:flex;gap:2px;background:var(--surface-2);padding:3px;border-radius:9px;margin-left:12px}
.tab{border:0;background:none;padding:6px 14px;border-radius:7px;font-weight:550;color:var(--muted);display:flex;align-items:center;gap:7px}
.tab[aria-selected="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.sync{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);white-space:nowrap;padding:0 4px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.sync[data-s="ok"] i{background:var(--ok)}
.sync[data-s="saving"] i{background:var(--warn);animation:pulse 1s infinite}
.sync[data-s="error"] i{background:var(--err)}
.sync[data-s="demo"] i{background:var(--accent)}
@keyframes pulse{50%{opacity:.35}}
.btn{border:1px solid var(--border-strong);background:var(--surface);border-radius:8px;padding:6px 12px;font-weight:550;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;text-decoration:none;color:var(--text)}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--err)}
.btn.danger.armed{background:var(--err);border-color:var(--err);color:#fff}
.icon-btn{border:1px solid transparent;background:none;border-radius:8px;width:32px;height:32px;display:inline-grid;place-items:center;color:var(--muted);flex:none;text-decoration:none}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
.chip-btn{border:1px solid var(--border);background:var(--surface-2);border-radius:999px;padding:4px 10px 4px 4px;display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:550;max-width:180px}
.chip-btn .av{width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}
.chip-btn span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip-btn.ask{border-color:var(--accent);color:var(--accent)}
#whoInput{width:150px;border:1px solid var(--accent);border-radius:999px;padding:5px 12px;background:var(--surface);outline:none}

/* ---------- toolbar */
.toolbar{padding:14px 20px 10px;display:flex;flex-direction:column;gap:10px}
.trow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.seg{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:3px;gap:2px;overflow-x:auto;max-width:100%;scrollbar-width:none}
.seg button{border:0;background:none;padding:5px 11px;border-radius:6px;font-size:13px;font-weight:550;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.seg button:hover:not([aria-pressed="true"]){color:var(--text)}
.nav{display:flex;align-items:center;gap:4px}
.nav .icon-btn{border-color:var(--border);background:var(--surface)}
.nav .icon-btn:disabled{opacity:.4;cursor:default}
.plabel{position:relative;display:inline-flex;align-items:center;gap:6px;font-size:17px;font-weight:650;letter-spacing:-.015em;padding:3px 8px;border-radius:8px;margin-left:4px;white-space:nowrap}
.plabel:hover{background:var(--surface-3)}
.plabel svg{color:var(--faint)}
/* input de fecha invisible encima del rótulo: abre el selector nativo */
.overlay-date{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;border:0;padding:0}
.overlay-date::-webkit-calendar-picker-indicator{position:absolute;inset:0;width:auto;height:auto;cursor:pointer}
.range-in{display:flex;align-items:center;gap:6px}
.range-in input{border:1px solid var(--border-strong);border-radius:8px;padding:5px 8px;background:var(--surface)}
.spacer{flex:1}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search{position:relative}
.search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none}
.search input{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:6px 10px 6px 30px;width:220px;outline:none}
.search input:focus,.fsel:focus{border-color:var(--accent)}
.fsel{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:6px 8px;outline:none;max-width:180px}
.fsel.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.strip{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.schip{--c:#94a3b8;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:3px 10px 3px 8px;font-size:12.5px;font-weight:550;color:var(--text)}
.schip i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.schip b{font-weight:650;color:var(--muted);font-variant-numeric:tabular-nums}
.schip.off{opacity:.45;text-decoration:line-through;background:transparent}
.schip:hover{border-color:var(--border-strong)}
.strip .lnk{border:0;background:none;color:var(--accent);font-size:12.5px;font-weight:550;padding:3px 4px}
.summary{font-size:12.5px;color:var(--muted);margin-left:auto;white-space:nowrap}
.summary b{color:var(--text);font-weight:650}
.summary .warn{color:var(--gap-ink)}

/* ---------- status pill (select) */
.pill{--c:#94a3b8;position:relative;display:inline-flex;align-items:center;border-radius:999px;background:color-mix(in srgb,var(--c) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 38%,transparent);color:color-mix(in srgb,var(--c) 62%,var(--text));font-size:12.5px;font-weight:600;height:26px;min-width:0}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c);position:absolute;left:9px;pointer-events:none}
.pill select{appearance:none;-webkit-appearance:none;border:0;background:transparent;padding:0 22px 0 22px;height:100%;border-radius:999px;font-weight:600;color:inherit;outline:none;width:100%;text-overflow:ellipsis;cursor:pointer}
.pill::after{content:"";position:absolute;right:9px;top:50%;width:5px;height:5px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:translateY(-70%) rotate(45deg);pointer-events:none;opacity:.7}
.pill select option{color:var(--text);background:var(--surface)}

/* ---------- list view */
main{padding:0 20px 40px}
.month-h{position:sticky;top:var(--head-h);z-index:5;background:var(--bg);margin:0;padding:16px 0 8px;font-size:13px;font-weight:650;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;gap:8px;align-items:baseline}
.month-h span{font-weight:500;text-transform:none;letter-spacing:0;color:var(--faint)}
.days{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.day{display:grid;grid-template-columns:76px 1fr 40px;border-top:1px solid var(--border);min-height:44px;position:relative}
.day:first-child{border-top:0}
.day.wknd .day-g{background:var(--weekend)}
.day-g{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 0;border-right:1px solid var(--border);gap:0}
.day-g .dw{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--faint)}
.day-g .dn{font-size:19px;font-weight:650;line-height:1.1;font-variant-numeric:tabular-nums}
.day-g .dm{font-size:11px;color:var(--faint)}
.day.today .day-g{background:var(--today-soft)}
.day.today .day-g .dn,.day.today .day-g .dw{color:var(--today)}
.day.past .day-g .dn{color:var(--muted)}
.day-b{min-width:0;padding:4px 0}
.day-add{border:0;background:none;color:var(--faint);display:grid;place-items:center;opacity:0;transition:opacity .12s}
.day:hover .day-add{opacity:1}
.day-add:hover{color:var(--accent)}
.day.drop{outline:2px dashed var(--accent);outline-offset:-3px;background:var(--accent-soft)}
.empty{display:flex;align-items:center;height:36px;padding:0 12px;width:100%;border:0;background:none;text-align:left;color:var(--faint);font-size:13px}
.day.gap .day-b,.day.gap .day-add{background:var(--gap)}
.day.gap .empty{color:var(--gap-ink);font-weight:550}
.day.gap .empty:hover{text-decoration:underline}
.row{display:grid;grid-template-columns:20px minmax(150px,1fr) 186px 106px 112px 136px 96px;align-items:center;gap:8px;padding:3px 8px 3px 4px;border-radius:7px;margin:0 4px;min-height:36px}
.row:hover{background:var(--surface-2)}
.row.dragging{opacity:.4}
.row.flash{animation:flash 1.4s ease-out}
@keyframes flash{0%{background:var(--accent-soft)}100%{background:transparent}}
.grip{color:var(--faint);cursor:grab;display:grid;place-items:center;height:28px;opacity:.5}
.row:hover .grip{opacity:1}
.ttl{border:1px solid transparent;background:transparent;border-radius:6px;padding:4px 6px;font-weight:550;min-width:0;width:100%;outline:none;text-overflow:ellipsis}
.ttl:hover{border-color:var(--border)}
.ttl:focus{border-color:var(--accent);background:var(--surface)}
.row.st-done .ttl{color:var(--muted)}
.row.st-dead .ttl{text-decoration:line-through;color:var(--faint)}
.mini{border:1px solid transparent;background:transparent;border-radius:6px;padding:4px 6px;font-size:13px;color:var(--muted);min-width:0;width:100%;outline:none;text-overflow:ellipsis}
.mini:hover{border-color:var(--border);background:var(--surface)}
.mini:focus{border-color:var(--accent);background:var(--surface);color:var(--text)}
select.mini{cursor:pointer}
.acts{display:flex;justify-content:flex-end;gap:0}
.acts .icon-btn{width:30px;height:30px;position:relative}
.acts .icon-btn.nolink{opacity:.25;pointer-events:none}
.backlog-h{display:flex;align-items:center;gap:8px}
.lv-empty{padding:48px 20px;text-align:center;color:var(--muted)}
.lv-empty b{display:block;color:var(--text);font-size:15px;margin-bottom:4px}

/* ---------- gantt */
.g-tools{display:flex;align-items:center;gap:10px;margin:0 0 10px;flex-wrap:wrap}
.g-tools label{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.g-note{font-size:12.5px;color:var(--muted)}
.g-tools .btn{padding:5px 11px;font-size:13px}

/* ---------- exportar */
.modal{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:rgba(10,14,20,.34);padding:16px}
.modal-card{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);width:min(460px,100%);display:flex;flex-direction:column;max-height:calc(100vh - 32px);overflow:auto}
.modal-body{padding:6px 20px 18px;display:grid;grid-template-columns:1fr 120px;gap:16px 18px;align-items:start}
.modal-body .opts{display:flex;flex-direction:column;gap:14px}
.modal-body h2{margin:0;font-size:18px;font-weight:650;letter-spacing:-.015em;grid-column:1/-1}
.modal .seg{background:var(--surface-2)}
.sheet-wrap{display:grid;place-items:center;height:130px}
.sheet{background:#fff;border:1px solid var(--border-strong);border-radius:3px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden;transition:width .2s,height .2s;display:flex;flex-direction:column;padding:6px;gap:3px}
.sheet i{display:block;height:3px;border-radius:2px;background:#dfe3ea}
.sheet i:first-child{width:55%;height:4px;background:#9aa3af;margin-bottom:3px}
.sheet b{display:block;height:3px;border-radius:2px}
.sheet .cap{position:absolute;right:5px;bottom:4px;font:600 10px Inter,system-ui,sans-serif;color:#8b939f}
.exp-info{grid-column:1/-1;margin:0;font-size:13px;color:var(--muted);line-height:1.55;background:var(--surface-2);border-radius:10px;padding:10px 12px}
.exp-info b{color:var(--text)}
.exp-warn{display:block;margin-top:6px;color:var(--gap-ink);font-weight:550}
@media (max-width: 480px){ .modal-body{grid-template-columns:1fr} .sheet-wrap{display:none} }
.zoom{display:flex;align-items:center;border:1px solid var(--border);border-radius:8px;background:var(--surface);overflow:hidden}
.zoom button{border:0;background:none;padding:5px 10px;font-size:13px;font-weight:550;color:var(--muted)}
.zoom button+button{border-left:1px solid var(--border)}
.zoom button:hover{color:var(--text);background:var(--surface-2)}
.gantt{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;position:relative}
.g-scroll{overflow:auto;height:100%;position:relative;overscroll-behavior:contain}
.g-inner{position:relative}
.g-head{position:sticky;top:0;z-index:20;display:flex;background:var(--surface);border-bottom:1px solid var(--border)}
.g-corner{position:sticky;left:0;z-index:21;background:var(--surface);border-right:1px solid var(--border);display:flex;align-items:flex-end;padding:0 12px 9px;font-size:11.5px;font-weight:650;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);flex:none}
.g-cal{position:relative;flex:none}
.g-months{height:26px;position:relative;border-bottom:1px solid var(--border)}
.g-month{position:absolute;top:0;height:26px;border-left:1px solid var(--border-strong);padding:5px 8px 0;font-size:12px;font-weight:650;white-space:nowrap;overflow:hidden;color:var(--text)}
.g-days{height:44px;position:relative}
.g-day{position:absolute;top:0;height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--muted);border-left:1px solid var(--grid);cursor:pointer;gap:2px;font-variant-numeric:tabular-nums}
.g-day:hover{background:var(--surface-2)}
.g-day .wd{font-size:9.5px;text-transform:uppercase;color:var(--faint);line-height:1}
.g-day .n{font-weight:600;line-height:1;color:var(--text)}
.g-day.we{background:var(--weekend)}
.g-day.today .n{color:#fff;background:var(--today);border-radius:4px;padding:2px 3px}
.g-day .cnt{height:4px;display:flex;gap:2px}
.g-day .cnt i{width:4px;height:4px;border-radius:50%;background:var(--accent);opacity:.75}
.g-day.gap{background:var(--gap)}
.g-day.gap .cnt i{background:var(--gap-ink)}
.g-body{position:relative}
.g-grid{position:absolute;top:0;bottom:0;pointer-events:none}
.g-we{position:absolute;top:0;bottom:0;background:var(--weekend)}
.g-gapcol{position:absolute;top:0;bottom:0;background:var(--gap);opacity:.55}
.g-vl{position:absolute;top:0;bottom:0;width:1px;background:var(--grid)}
.g-ml{position:absolute;top:0;bottom:0;width:1px;background:var(--border-strong)}
.g-today{position:absolute;top:0;bottom:0;width:2px;background:var(--today);opacity:.85}
.g-row{display:flex;height:36px;position:relative}
.g-row:hover .g-label,.g-row:hover .g-track{background-color:color-mix(in srgb,var(--surface-2) 70%,transparent)}
.g-label{position:sticky;left:0;z-index:10;background:var(--surface);border-right:1px solid var(--border);display:flex;align-items:center;gap:8px;padding:0 10px 0 12px;flex:none;cursor:pointer;min-width:0;border-bottom:1px solid var(--grid)}
.g-label .dot{width:8px;height:8px;border-radius:50%;flex:none}
.g-label .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:550;font-size:13px;flex:1;min-width:0}
.g-label .d{font-size:11.5px;color:var(--faint);white-space:nowrap;font-variant-numeric:tabular-nums}
.g-label.dead .t{text-decoration:line-through;color:var(--faint)}
.g-track{position:relative;flex:none;border-bottom:1px solid var(--grid)}
.g-grp .g-label{background:var(--surface-2);font-size:12px;font-weight:650;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;cursor:default}
.g-grp .g-track{background:var(--surface-2)}
.bar{--c:#94a3b8;position:absolute;top:9px;height:18px;border-radius:5px;background:color-mix(in srgb,var(--c) 22%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 55%,transparent);cursor:grab;touch-action:none}
.bar .h{position:absolute;left:-3px;top:0;bottom:0;width:9px;cursor:ew-resize}
.bar.clipL{border-left-style:dashed;border-top-left-radius:0;border-bottom-left-radius:0}
.ms{--c:#94a3b8;position:absolute;top:10px;width:16px;height:16px;margin-left:-8px;cursor:grab;touch-action:none;display:grid;place-items:center;z-index:2}
.ms i{width:11px;height:11px;background:var(--c);transform:rotate(45deg);border-radius:2px;box-shadow:0 0 0 2px var(--surface)}
.ms:hover i,.bar:hover{filter:brightness(1.08)}
.ms.dead i{background:transparent;border:2px solid var(--c)}
.dragging-g,.dragging-g *{cursor:grabbing!important;user-select:none}
.tip{position:fixed;z-index:80;pointer-events:none;background:var(--text);color:var(--bg);font-size:12px;font-weight:600;padding:5px 9px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-130%);display:none}
.g-empty{padding:48px 20px;text-align:center;color:var(--muted)}

/* ---------- drawer */
.scrim{position:fixed;inset:0;background:rgba(10,14,20,.28);z-index:60;opacity:0;pointer-events:none;transition:opacity .18s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:440px;max-width:100vw;background:var(--surface);z-index:61;box-shadow:var(--shadow);transform:translateX(105%);transition:transform .22s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
.drawer.on{transform:none}
.dr-head{display:flex;align-items:center;gap:8px;padding:14px 16px 0 20px}
.dr-kicker{font-size:11.5px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.dr-body{padding:6px 20px 20px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:14px}
.dr-title{font-size:20px;font-weight:650;letter-spacing:-.015em;border:1px solid transparent;border-radius:8px;padding:6px 8px;margin:0 -8px;background:transparent;outline:none;width:calc(100% + 16px)}
.dr-title:hover{border-color:var(--border)}
.dr-title:focus{border-color:var(--accent)}
.dr-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--muted);min-width:0}
.fld input,.fld select,.fld textarea{border:1px solid var(--border-strong);border-radius:8px;padding:7px 9px;background:var(--surface);font-size:14px;font-weight:450;color:var(--text);outline:none;width:100%;min-width:0}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--accent)}
.fld textarea{resize:vertical;min-height:96px;line-height:1.45}
.fld .pill{height:36px;font-size:14px}
.fld .pill select{border:0;padding-left:24px}
.inrow{display:flex;gap:6px}
.inrow input{flex:1}
.dr-box{border:1px solid var(--border);border-radius:var(--radius);padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--surface-2)}
.dr-box .lbl{font-size:12px;font-weight:650;color:var(--muted);display:flex;align-items:center;gap:6px}
.dr-box .inrow select{flex:1;border:1px solid var(--border-strong);border-radius:8px;padding:6px 8px;background:var(--surface);min-width:0}
.dr-box .hint{font-size:12px;color:var(--faint);margin:0}
.dr-actions{display:flex;gap:8px;flex-wrap:wrap}
.dr-meta{font-size:12px;color:var(--faint);margin:0}
.dr-foot{padding:12px 20px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}

/* ---------- toasts / misc */
.toasts{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;width:max-content;max-width:calc(100vw - 32px)}
.toast{background:var(--text);color:var(--bg);border-radius:10px;padding:10px 14px;font-size:13px;font-weight:500;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow);animation:tin .2s ease-out}
.toast.warn{background:var(--warn);color:#fff}
.toast.err{background:var(--err);color:#fff}
.toast button{border:0;background:none;color:inherit;font-weight:700;text-decoration:underline;padding:0}
@keyframes tin{from{transform:translateY(8px);opacity:0}}
.loading{display:grid;place-items:center;padding:80px 20px;color:var(--muted);gap:12px}
.spin{width:22px;height:22px;border:2.5px solid var(--border-strong);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.fatal{max-width:560px;margin:60px auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px}
.fatal code{background:var(--surface-2);padding:2px 5px;border-radius:4px}
kbd{font:11px/1 ui-monospace,monospace;border:1px solid var(--border-strong);border-bottom-width:2px;border-radius:4px;padding:1px 4px;color:var(--muted)}

/* ---------- responsive */
@media (max-width: 1100px){
  .row{grid-template-columns:20px minmax(140px,1fr) 172px 100px 130px 96px}
  .row .c-red{display:none}
}
@media (max-width: 860px){
  .brand p,.sync span{display:none}
  .row{grid-template-columns:18px 1fr 96px;grid-template-areas:"g t a" "g s s";row-gap:2px;padding:6px 6px 6px 2px}
  .row .grip{grid-area:g}
  .row .ttl{grid-area:t}
  .row .acts{grid-area:a}
  .row .pill{grid-area:s;justify-self:start;max-width:100%}
  .row .c-fmt,.row .c-red,.row .c-resp{display:none}
  .summary{margin-left:0;width:100%}
}
@media (max-width: 640px){
  :root{--head-h:0px}
  .top{position:static;flex-wrap:wrap;height:auto;padding:10px 16px;gap:8px 10px}
  .tabs{order:3;margin-left:0;width:100%}
  .tab{flex:1;justify-content:center}
  .toolbar{padding:12px 16px 8px}
  main{padding:0 16px 32px}
  .search input{width:100%}
  .search{flex:1;min-width:160px}
  .day{grid-template-columns:54px 1fr 0}
  .day-add{display:none}
  .plabel{font-size:15px}
  .drawer{width:100vw}
  .dr-grid{grid-template-columns:1fr}
  #btnNew .lbl{display:none}
}
</style>

/* =====================================================================
   Fechas (siempre como texto ISO yyyy-mm-dd, aritmética en UTC)
   ===================================================================== */
const DOW = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const DOWL = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const MON = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const MONL = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const p2 = n => String(n).padStart(2,'0');
const D = {
  t(s){ const [y,m,d] = s.split('-').map(Number); return Date.UTC(y, m-1, d); },
  iso(t){ const x = new Date(t); return x.getUTCFullYear()+'-'+p2(x.getUTCMonth()+1)+'-'+p2(x.getUTCDate()); },
  add(s,n){ return D.iso(D.t(s) + n*864e5); },
  diff(a,b){ return Math.round((D.t(b) - D.t(a)) / 864e5); },
  dow(s){ return new Date(D.t(s)).getUTCDay(); },
  y(s){ return +s.slice(0,4); }, m(s){ return +s.slice(5,7)-1; }, d(s){ return +s.slice(8,10); },
  mStart(s){ return s.slice(0,8)+'01'; },
  mEnd(s){ const x = new Date(Date.UTC(D.y(s), D.m(s)+1, 0)); return D.iso(x.getTime()); },
  addM(s,n){ const y=D.y(s), m=D.m(s)+n; const last = new Date(Date.UTC(y, m+1, 0)).getUTCDate(); return D.iso(Date.UTC(y, m, Math.min(D.d(s), last))); },
  today(){ const n = new Date(); return n.getFullYear()+'-'+p2(n.getMonth()+1)+'-'+p2(n.getDate()); },
  valid(s){ return /^\d{4}-\d{2}-\d{2}$/.test(s||''); },
  short(s){ return D.valid(s) ? DOW[D.dow(s)]+' '+D.d(s)+' '+MON[D.m(s)] : 'Sin fecha'; },
  long(s){ return DOWL[D.dow(s)]+' '+D.d(s)+' de '+MONL[D.m(s)].toLowerCase()+' '+D.y(s); },
};

const EXEC_URL = 'https://script.google.com/macros/s/AKfycbwdrR__gGyz6IZt33PX0tRV-3tSkV5PXp7byCsfUdHhcWUgSpnoPtWyKOM_9u3GRvpR/exec';

const IS_GAS = typeof google !== 'undefined' && google.script && google.script.run;

function remoteApi(){
  // HTML abierto fuera de Apps Script: habla con la aplicación web por fetch.
  // GET para leer y POST text/plain para escribir (así no hay preflight CORS).
  async function unwrap(res){
    if (!res.ok) throw new Error('El servidor respondió ' + res.status + '. Revisá que la implementación tenga acceso "Cualquier persona".');
    const txt = await res.text();
    let j; try { j = JSON.parse(txt); } catch (e){
      throw new Error('La URL no devolvió datos. ¿Pegaste el Code.gs nuevo y publicaste una nueva versión de la implementación?');
    }
    if (!j.ok) throw new Error(j.error || 'Error en el script');
    return j.data;
  }
  async function req(action, args){
    let res;
    try {
      res = args === undefined
        ? await fetch(EXEC_URL + '?action=' + action + '&_=' + Date.now(), { redirect: 'follow' })
        : await fetch(EXEC_URL, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, args }) });
    } catch (e){
      throw new Error('No se pudo conectar con la planilla. Lo más común: la implementación no tiene acceso "Cualquier persona", o no hay internet.');
    }
    return unwrap(res);
  }
  return {
    getData: () => req('getData'),
    getRev: () => req('getRev'),
    createItem: (d, w) => req('createItem', [d, w]),
    createMany: (l, w) => req('createMany', [l, w]),
    updateItem: (id, p, v, w) => req('updateItem', [id, p, v, w]),
    updateMany: (c, w) => req('updateMany', [c, w]),
    deleteItem: (id, w) => req('deleteItem', [id, w]),
  };
}

function gasApi(){
  const call = (fn, ...args) => new Promise((res, rej) =>
    google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...args));
  return {
    getData: () => call('getData'),
    getRev: () => call('getRev'),
    createItem: (d, w) => call('createItem', d, w),
    createMany: (l, w) => call('createMany', l, w),
    updateItem: (id, p, v, w) => call('updateItem', id, p, v, w),
    updateMany: (c, w) => call('updateMany', c, w),
    deleteItem: (id, w) => call('deleteItem', id, w),
  };
}

function demoApi(){
  // Sin Apps Script: arranca con los contenidos programados (SEED) y guarda los cambios en este navegador
  const KEY = 'calcont-local-data';
  let store = null, rev = 1;
  const wait = v => new Promise(r => setTimeout(() => r(JSON.parse(JSON.stringify(v))), 120));
  const stamp = (it, w) => { it.actualizado = new Date().toISOString(); it.por = w || 'local'; };
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ items: store, rev })); } catch(e){} };
  const load = () => {
    try { const d = JSON.parse(localStorage.getItem(KEY) || 'null'); if (d && Array.isArray(d.items)){ rev = d.rev || 1; return d.items; } } catch(e){}
    return JSON.parse(JSON.stringify(SEED));
  };
  const cfg = { estados:[['Idea','#94A3B8'],['En curso','#3B82F6'],['Faltan tomas','#F97316'],['En proceso de revisión','#A855F7'],['Aceptada','#14B8A6'],['Para publicar','#EAB308'],['Programado','#6366F1'],['Publicado','#22C55E'],['no se publica','#78716C'],['ELIMINADO','#EF4444']].map(([nombre,color])=>({nombre,color})), formatos:['Reel','Post','Carrusel','Historia','Video','Otro'], redes:['Instagram','TikTok','LinkedIn','Facebook','YouTube','X'] };
  const apply = (id, patch, w) => { const it = store.find(x => x.id === id); if (!it) throw new Error('El contenido ya no existe.'); Object.assign(it, patch); it.version++; stamp(it, w); return it; };
  const commit = v => { rev++; save(); return wait(Object.assign(v, { rev })); };
  // otra pestaña del mismo navegador modificó los datos
  window.addEventListener('storage', e => { if (e.key === KEY) store = load(); });
  return {
    async getData(){ store = load(); return wait({ items: store, config: cfg, rev, user: '', sheetUrl: '' }); },
    getRev: () => wait(rev),
    async createItem(d, w){ const it = Object.assign({ id: 'n' + Date.now().toString(36), version: 1 }, d); stamp(it, w); store.push(it); return commit({ item: it }); },
    async updateItem(id, p, v, w){ return commit({ item: apply(id, p, w), conflicted: false }); },
    async updateMany(ch, w){ return commit({ items: ch.map(c => apply(c.id, c.patch, w)), conflicted: false }); },
    async deleteItem(id){ store = store.filter(x => x.id !== id); return commit({ ok: true }); },
  };
}

/* =====================================================================
   Período
   ===================================================================== */
function range(){
  const p = S.period, a = p.anchor;
  switch (p.mode){
    case 'dia': return [a, a];
    case 'semana': { const f = D.add(a, -((D.dow(a)+6)%7)); return [f, D.add(f, 6)]; }
    case 'mes': return [D.mStart(a), D.mEnd(a)];
    case '2m': return [D.mStart(a), D.mEnd(D.addM(D.mStart(a), 1))];
    case '3m': return [D.mStart(a), D.mEnd(D.addM(D.mStart(a), 2))];
    case 'rango': {
      let f = D.valid(p.from) ? p.from : D.mStart(a), t = D.valid(p.to) ? p.to : D.mEnd(a);
      return f <= t ? [f, t] : [t, f];
    }
    case 'todo': {
      const ds = S.items.map(i => i.fecha).filter(D.valid).sort();
      return ds.length ? [D.mStart(ds[0]), D.mEnd(ds[ds.length-1])] : [D.mStart(a), D.mEnd(a)];
    }
  }
}
function shiftPeriod(dir){
  const p = S.period;
  if (p.mode === 'todo') return;
  if (p.mode === 'rango'){
    const [f, t] = range(), n = D.diff(f, t) + 1;
    p.from = D.add(f, dir*n); p.to = D.add(t, dir*n);
  } else if (p.mode === 'dia') p.anchor = D.add(p.anchor, dir);
  else if (p.mode === 'semana') p.anchor = D.add(p.anchor, 7*dir);
  else p.anchor = D.addM(p.anchor, dir);
  S.scrollToToday = false;
  renderAll();
}
function periodLabel(){
  const [f, t] = range(), m = S.period.mode;
  if (m === 'dia') return D.long(f);
  if (m === 'mes') return MONL[D.m(f)] + ' ' + D.y(f);
  if (m === '2m' || m === '3m'){
    return MONL[D.m(f)].slice(0,3) + (D.y(f) !== D.y(t) ? ' ' + D.y(f) : '') + ' – ' + MONL[D.m(t)].slice(0,3) + ' ' + D.y(t);
  }
  if (m === 'todo') return 'Todo el calendario';
  const sameY = D.y(f) === D.y(t), sameM = sameY && D.m(f) === D.m(t);
  if (sameM) return D.d(f) + ' – ' + D.d(t) + ' ' + MON[D.m(t)] + ' ' + D.y(t);
  return D.d(f) + ' ' + MON[D.m(f)] + (sameY ? '' : ' ' + D.y(f)) + ' – ' + D.d(t) + ' ' + MON[D.m(t)] + ' ' + D.y(t);
}

/* =====================================================================
   Filtros
   ===================================================================== */
function passesFilters(it, withStatus = true){
  if (withStatus && S.hidden.has(it.estado || 'Idea')) return false;
  if (S.f.formato && (it.formato || '—') !== S.f.formato) return false;
  if (S.f.red && (it.red || '—') !== S.f.red) return false;
  if (S.f.resp && (it.responsable || '—') !== S.f.resp) return false;
  if (S.f.q){
    const hay = (it.titulo + ' ' + it.notas + ' ' + it.responsable + ' ' + it.formato).toLowerCase();
    if (!S.f.q.split(/\s+/).every(w => hay.includes(w))) return false;
  }
  return true;
}
function inRange(it, f, t){
  if (!D.valid(it.fecha)) return false;
  const s = D.valid(it.inicio) && it.inicio < it.fecha ? it.inicio : it.fecha;
  return it.fecha >= f ? s <= t : false;
}
const inDayRange = (it, f, t) => D.valid(it.fecha) && it.fecha >= f && it.fecha <= t;
function allEstados(){
  const list = S.config.estados.map(e => e.nombre);
  S.items.forEach(i => { const e = i.estado || 'Idea'; if (!list.includes(e)) list.push(e); });
  return list;
}

function isEditing(){

  return a && $('#main').contains(a) && /INPUT|TEXTAREA/.test(a.tagName) && a.type !== 'date';
}
function safeRender(){
  if (!S.ready) return;
  if (S.drag || isEditing()){ S.dirty = true; return; }

}

function renderToolbar(){
  $('#toolbar').hidden = false;
  $$('.tab').forEach(b => b.setAttribute('aria-selected', b.dataset.view === S.view));
  $$('#modeSeg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === S.period.mode));
  const isR = S.period.mode === 'rango';
  $('#plabel').hidden = isR; $('#rangeIn').hidden = !isR;
  $('#plabelText').textContent = periodLabel();
  const [f, t] = range();
  $('#jump').value = S.period.mode === 'todo' ? D.today() : f;
  if (isR){ $('#rFrom').value = f; $('#rTo').value = t; }
  $('#prev').disabled = $('#next').disabled = S.period.mode === 'todo';
  // opciones de filtros
  const fill = (sel, label, opts, cur) => {
    sel.innerHTML = '<option value="">' + label + '</option>' + opts.map(o => '<option' + (o === cur ? ' selected' : '') + '>' + esc(o) + '</option>').join('');
    sel.classList.toggle('on', !!cur);
  };
  const uniq = (key, base = []) => { const s = new Set(base); S.items.forEach(i => s.add(i[key] || '—')); return [...s].filter(Boolean); };
  fill($('#fFormato'), 'Formato: todos', uniq('formato', S.config.formatos), S.f.formato);
  fill($('#fRed'), 'Red: todas', uniq('red', S.config.redes), S.f.red);
  const resp = uniq('responsable').sort((a,b) => a === '—' ? 1 : b === '—' ? -1 : a.localeCompare(b));
  fill($('#fResp'), 'Responsable: todos', resp, S.f.resp);
  $('#dlResp').innerHTML = resp.filter(r => r !== '—').map(r => '<option value="' + esc(r) + '">').join('');
}

function renderStrip(){
  const [f, t] = range();
  const base = S.items.filter(i => inDayRange(i, f, t) && passesFilters(i, false));
  const counts = {}; base.forEach(i => { const e = i.estado || 'Idea'; counts[e] = (counts[e] || 0) + 1; });
  const chips = allEstados().map(e => {
    const n = counts[e] || 0;
    return '<button class="schip' + (S.hidden.has(e) ? ' off' : '') + '" data-est="' + esc(e) + '" style="--c:' + esc(colorOf(e)) + '" title="Clic: mostrar/ocultar · Doble clic: ver solo este estado"><i></i>' + esc(e) + ' <b>' + n + '</b></button>';
  }).join('');
  const shown = base.filter(i => !S.hidden.has(i.estado || 'Idea')).length;
  // días sin contenido desde hoy hasta el fin del período
  const start = f > D.today() ? f : D.today();
  let gaps = 0;
  if (S.period.mode !== 'todo' && start <= t){
    const days = new Set(S.items.filter(i => !DEAD.includes(i.estado) && D.valid(i.fecha)).map(i => i.fecha));
    for (let d = start; d <= t; d = D.add(d, 1)) if (!days.has(d)) gaps++;
  }
  $('#strip').innerHTML = chips +
    '<button class="lnk" data-preset="all">Todos</button><button class="lnk" data-preset="pend">Solo pendientes</button>' +
    '<span class="summary"><b>' + shown + '</b> contenido' + (shown === 1 ? '' : 's') + ' en el período' +
    (gaps ? ' · <span class="warn"><b>' + gaps + '</b> día' + (gaps === 1 ? '' : 's') + ' sin contenido</span>' : '') + '</span>';
}
